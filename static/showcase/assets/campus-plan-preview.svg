<svg xmlns="http://www.w3.org/2000/svg" viewBox="426 812 196 313" role="img" aria-labelledby="title description"><title id="title">储能、开关站与运维区</title><desc id="description">附图1原始场坪、道路与局部围栏；设备点位按附图3-2配准，仅为点位示意，不代表设备尺寸或采购数量。虚线对应原图粉色FENCE，不补画闭合边。</desc><style>:root{--plan-ink:oklch(27% 0.012 60);--plan-muted:oklch(45% 0.015 65);--plan-accent:oklch(51% 0.12 43);--plan-wash:oklch(94% 0.025 55);--plan-font:"Segoe UI","Microsoft YaHei",sans-serif}
